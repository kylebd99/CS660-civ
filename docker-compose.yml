# One PostgreSQL, nothing else. The game has no server process: the database
# is the server, and client/civ.py is just a terminal attached to it.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: civ
      POSTGRES_PASSWORD: civ
      POSTGRES_DB: civ
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civ"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
